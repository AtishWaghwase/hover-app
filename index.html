<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Hover</title>

  <!-- Android Chrome status bar colour -->
  <meta name="theme-color" content="#000000" />

  <!-- iOS full-screen / status bar -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Hover" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .logo {
      width: min(280px, 75vw);
      /* 3 s pause → 0.9 s ease-in-out spin, loops forever */
      animation: spin 3.9s linear infinite;
    }

    @keyframes spin {
      0%,  77%  { transform: rotate(0deg); }
      /* ease-in-out cubic applied only for the spin segment */
      77%       { animation-timing-function: cubic-bezier(0.37, 0, 0.63, 1); }
      100%      { transform: rotate(360deg); }
    }
  </style>
</head>
